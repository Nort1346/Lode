services:
  redis:
    image: redis:7-alpine
    container_name: streamhub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: streamhub-qbittorrent
    restart: unless-stopped
    ports:
      - '8080:8080'
      - '6881:6881'
      - '6881:6881/udp'
    volumes:
      - qbittorrent-config:/config
      - /mnt/storage/streaming:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - WEBUI_PORT=8080

  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: streamhub-qui
    restart: unless-stopped
    ports:
      - '7476:7476'
    volumes:
      - qui-config:/config
    depends_on:
      qbittorrent:
        condition: service_started

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: streamhub-prowlarr
    restart: unless-stopped
    ports:
      - '9696:9696'
    volumes:
      - prowlarr-config:/config

  streamhub:
    image: ghcr.io/nort1346/streamhub:latest
    container_name: streamhub
    ports:
      - '5757:5757'
    volumes:
      - ./data:/app/.data
      - streamhub-avatars:/app/.output/public/avatars
      - /mnt/storage/streaming:/mnt/storage/streaming:ro
      - /:/host-root:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_started
      qui:
        condition: service_started
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: streamhub-jellyfin
    restart: unless-stopped
    ports:
      - '8096:8096'
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /mnt/storage/streaming:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096

  dozzle:
    image: amir20/dozzle:latest
    container_name: streamhub-dozzle
    restart: unless-stopped
    ports:
      - '8082:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── PostgreSQL (uncomment when DB_DRIVER=postgres) ────────
