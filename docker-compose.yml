services:
  redis:
    image: redis:7-alpine
    container_name: streamhub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: streamhub-flaresolverr
    restart: unless-stopped
    ports:
      - '8191:8191'
    environment:
      - LOG_LEVEL=info
      - BROWSER_TIMEOUT=60000

  streamhub:
    build: .
    container_name: streamhub
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/.data
      - /mnt/storage/streaming:/mnt/storage/streaming:ro
      - /:/host-root:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis
      - flaresolverr
    restart: unless-stopped

volumes:
  redis-data:
