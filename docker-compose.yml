services:
  redis:
    image: redis:7-alpine
    container_name: streamhub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: streamhub-flaresolverr
    restart: unless-stopped
    ports:
      - '8191:8191'
    environment:
      - LOG_LEVEL=info
      - BROWSER_TIMEOUT=60000

  # ── PostgreSQL (only used when DB_DRIVER=postgres) ────────
  postgres:
    image: postgres:16-alpine
    container_name: streamhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: streamhub
      POSTGRES_USER: streamhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streamhub']
      interval: 5s
      timeout: 3s
      retries: 5

  streamhub:
    build: .
    container_name: streamhub
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/.data
      - streamhub-avatars:/app/public/avatars
      - /mnt/storage/streaming:/mnt/storage/streaming:ro
      - /:/host-root:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_started
      flaresolverr:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: streamhub-dozzle
    restart: unless-stopped
    ports:
      - '8082:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  redis-data:
  postgres-data:
  streamhub-avatars:
