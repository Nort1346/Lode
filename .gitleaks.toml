title = "Lode gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholder values in README, docs and .env.example are not real secrets"
paths = [
  '''^README\.md$''',
  '''^docs/getting-started\.md$''',
  '''(^|/)\.env\.example$'''
]
stopwords = ['replace_me_with_64_hex_chars']
