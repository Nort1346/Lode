name: cli

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'

# Builds the standalone setup CLI (cli/) as native binaries for 6 targets and
# publishes them to the same GitHub release that the docker workflow creates.
# Windows binaries are stamped with version metadata (rcedit) and Authenticode-
# signed through SignPath before publishing. The publish job polls for that
# release because it lands after the (much slower) docker image build.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Lint
        working-directory: cli
        run: bun run lint

      - name: Test
        working-directory: cli
        run: bun run test

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Cross-compiles from a single Linux runner - Bun embeds the runtime, so
    # each target is one fast `bun build --compile` with no toolchain needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Compile binaries
        working-directory: cli
        run: |
          set -euo pipefail
          declare -A targets=(
            [linux-x64]='bun-linux-x64'
            [linux-arm64]='bun-linux-arm64'
            [darwin-x64]='bun-darwin-x64'
            [darwin-arm64]='bun-darwin-arm64'
            [windows-x64]='bun-windows-x64'
            [windows-arm64]='bun-windows-arm64'
          )
          for name in "${!targets[@]}"; do
            ext=""
            [[ "$name" == windows-* ]] && ext=".exe"
            bun build src/index.ts \
              --compile --minify \
              --target="${targets[$name]}" \
              --define BUILD_VERSION="\"${GITHUB_REF_NAME}\"" \
              --outfile "dist/lode-setup-${name}${ext}"
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lode-setup-binaries
          path: cli/dist

  sign-windows:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30

    # The SignPath action fetches the artifact under submission with
    # GITHUB_TOKEN, so it needs read access to workflow artifacts.
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: lode-setup-binaries
          path: cli/dist

      # rcedit stamps version metadata into the PE resource section in place;
      # unsigned, metadata-less exes like Bun's trip heuristic AV detection.
      - name: Stamp version metadata with rcedit
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $parts = $version -split '\.'
          if ($parts.Count -lt 3) { throw "Expected a vX.Y.Z tag, got $env:GITHUB_REF_NAME" }
          $fileVersion = "$($parts[0]).$($parts[1]).$($parts[2])"

          $rcedit = Join-Path $env:RUNNER_TEMP 'rcedit.exe'
          curl.exe -fL --output $rcedit 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download rcedit' }

          $binaries = @(
            'cli/dist/lode-setup-windows-x64.exe',
            'cli/dist/lode-setup-windows-arm64.exe'
          )
          foreach ($binary in $binaries) {
            if (-not (Test-Path -LiteralPath $binary)) { throw "Missing binary: $binary" }
            & $rcedit $binary `
              --set-version-string FileDescription 'Lode setup CLI' `
              --set-version-string ProductName 'Lode' `
              --set-version-string CompanyName 'Nort1346' `
              --set-file-version $fileVersion `
              --set-product-version $version
            if ($LASTEXITCODE -ne 0) { throw "rcedit failed on $binary (exit code $LASTEXITCODE)" }
          }

      # SignPath signs files stored in a GitHub artifact (fetched server-side),
      # so the exes must be uploaded first. The zip holds both exes at its root;
      # the SignPath artifact configuration must mirror that (<zip-file> root
      # with one <file> entry per exe).
      - name: Upload Windows binaries for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: lode-setup-windows-unsigned
          path: |
            cli/dist/lode-setup-windows-x64.exe
            cli/dist/lode-setup-windows-arm64.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: cli/dist/signed
          wait-for-completion-timeout-in-seconds: 1800

      - name: Upload signed Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: lode-setup-windows-signed
          path: |
            cli/dist/signed/lode-setup-windows-x64.exe
            cli/dist/signed/lode-setup-windows-arm64.exe
          if-no-files-found: error

  publish:
    needs: [check, build, sign-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: lode-setup-binaries
          path: cli/dist

      # The signed exes come from sign-windows. Delete the unsigned ones first
      # so a broken signing run can never leak an unsigned binary into the
      # release.
      - name: Drop unsigned Windows binaries
        run: |
          set -euo pipefail
          rm cli/dist/lode-setup-windows-x64.exe cli/dist/lode-setup-windows-arm64.exe

      - name: Download signed Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: lode-setup-windows-signed
          path: cli/dist

      - name: Verify all six binaries
        run: |
          set -euo pipefail
          for f in \
            lode-setup-linux-x64 lode-setup-linux-arm64 \
            lode-setup-darwin-x64 lode-setup-darwin-arm64 \
            lode-setup-windows-x64.exe lode-setup-windows-arm64.exe
          do
            test -f "cli/dist/$f" || { echo "missing binary: $f" >&2; exit 1; }
          done

      # The docker workflow creates the release after its image build
      # finishes, which can outlast this pipeline - poll for it.
      - name: Wait for the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          max_attempts=450
          start="$(date +%s)"
          for attempt in $(seq 1 "${max_attempts}"); do
            elapsed=$(( $(date +%s) - start ))
            # Capture gh's output: a real failure (auth, permission, rate limit)
            # must surface, not masquerade as "not found yet".
            if out="$(gh release view "${tag}" 2>&1)"; then
              echo "Release ${tag} found (attempt ${attempt}, ${elapsed}s elapsed)"
              exit 0
            fi
            # Log every attempt so a stuck run is diagnosable from the live log.
            echo "attempt ${attempt}/${max_attempts} (${elapsed}s elapsed): release not ready - ${out}"
            sleep 10
          done
          echo "GitHub release ${tag} was not created within 75 minutes" >&2
          exit 1

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" cli/dist/* --clobber
