name: docker

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nort1346/lode
  # buildx --load only supports a single platform; we scan this one before pushing.
  SCAN_PLATFORM: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TRIVY_DISABLE_VEX_NOTICE: '1'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (release)
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta-release
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Extract metadata (nightly)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        id: meta-nightly
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly
            type=sha,prefix=

      # Build the primary platform locally (no push) so Trivy scans exactly what we
      # are about to publish. buildx --load is single-platform only; amd64 is present
      # in the multi-platform push and is representative for the OS/dependency CVEs.
      - name: Build for scan (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.SCAN_PLATFORM }}
          push: false
          load: true
          tags: ${{ steps.meta-release.outputs.tags }}
          labels: ${{ steps.meta-release.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build for scan (nightly)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.SCAN_PLATFORM }}
          push: false
          load: true
          tags: ${{ steps.meta-nightly.outputs.tags }}
          labels: ${{ steps.meta-nightly.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: the push steps below only run if this scan passes (exit-code 1).
      - name: Scan image (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan image (nightly)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      # Publish all platforms only after a clean scan (steps stop on failure).
      - name: Build and push (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-release.outputs.tags }}
          labels: ${{ steps.meta-release.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (nightly)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-nightly.outputs.tags }}
          labels: ${{ steps.meta-nightly.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Lode ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Lode ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
