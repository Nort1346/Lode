# PostgreSQL overlay - combine with the base:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: lode-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: lode
      POSTGRES_USER: lode
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lode']
      interval: 5s
      timeout: 3s
      retries: 5

  lode:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
