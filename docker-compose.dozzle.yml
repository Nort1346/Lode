# Dozzle overlay - combine with the base:
#   docker compose -f docker-compose.yml -f docker-compose.dozzle.yml up -d

services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: lode-dozzle
    restart: unless-stopped
    ports:
      - '8082:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_FILTER=label=com.docker.compose.project=lode
