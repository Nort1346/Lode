<svg
  xmlns="http://www.w3.org/2000/svg"
  width="440"
  height="100"
  viewBox="0 0 440 100"
  role="img"
  aria-label="StreamHub"
>
  <defs>
    <linearGradient id="sh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#d97706" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="sh-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <style>
    .brand {
      fill: url(#sh-grad);
    }
    @media (prefers-color-scheme: dark) {
      .brand {
        fill: url(#sh-grad-dark);
      }
    }
  </style>
  <text
    class="brand"
    x="10"
    y="74"
    font-family="Inter, 'Public Sans', Helvetica, Arial, sans-serif"
    font-size="76"
    font-weight="700"
  >
    StreamHub
  </text>
</svg>
