# Trivy secret-scanning allowlist. Loaded automatically by `trivy fs` /
# `trivy image` (and by the trivy-action step in .github/workflows/docker.yml,
# which runs with the repo as its working directory).
#
# The regex below is Lode's intentionally public, shared TMDB API key - the
# built-in fallback used when NUXT_TMDB_API_KEY is unset (same approach as
# Overseerr/Jellyseerr shipping a public key). It is NOT a leaked secret, so
# this is a documented, deliberate exception - do not remove without also
# removing BUILTIN_TMDB_API_KEY from server/utils/tmdb.ts.
# The equivalent gitleaks stopword lives in .gitleaks.toml.
allow-rules:
  - id: lode-public-tmdb-key
    description: >-
      Intentionally public, shared TMDB API key (Overseerr/Jellyseerr style)
      used as a built-in fallback. Not a leaked secret.
    regex: '431a8708161bcd1f1fbe7536137e61ed'
