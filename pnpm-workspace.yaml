# CVE-2025-68121 (Go < 1.25.7): esbuild < 0.28.0 ships a Go binary built with an affected
# Go version, and several deps pin old esbuild copies transitively (drizzle-kit,
# @nuxtjs/i18n, @nuxt/ui). This floor forces every transitive esbuild to a fixed build.
# Do not remove - a stale transitive esbuild silently reintroduces the CVE.
# (pnpm >= 12 no longer reads the "pnpm" field of package.json, so overrides live here.)
overrides:
  esbuild: '>=0.28.0'
  http-cache-semantics: '>=4.3.0'
  simple-git: '>=4.0.2'
  '@simple-git/argv-parser': '>=2.0.1'
  '@intlify/core-base@>=11.1.10 <11.4.14': '>=11.4.14'
  '@intlify/core-base@>=9.0.0-beta.12 <11.4.14': '>=11.4.14'
  '@intlify/core@>=11.1.10 <11.4.14': '>=11.4.14'
  '@intlify/core@>=9.0.0-beta.10 <11.4.14': '>=11.4.14'
  '@intlify/shared@>=11.1.10 <11.4.14': '>=11.4.14'
  '@nuxt/nitro-server@>=4.2.0 <4.6.4': '>=4.6.4'
  '@nuxt/nitro-server@>=4.4.6 <4.6.4': '>=4.6.4'
  '@nuxt/nitro-server@>=4.6.0 <4.6.4': '>=4.6.4'
  '@nuxt/schema@>=3.5.0 <4.6.4': '>=4.6.4'
  '@nuxt/vite-server@>=4.6.0 <4.6.4': '>=4.6.4'
  fast-uri@>=3.0.0 <3.1.9: '>=3.1.9'
  fast-uri@>=3.1.3 <3.1.9: '>=3.1.9'
  glob@>=9.0.0 <=14.0.1: '>=14.0.2'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'
  'eslint-plugin-import-x@<4.18.1': '>=4.18.1'
  node-forge@<=1.4.0: '>=1.4.1'
  node-forge@<=1.4.2: '>=1.4.3'
  node-forge@>=0.1.2 <=1.4.2: '>=1.4.3'
  nuxt@>=4.0.0 <4.6.4: '>=4.6.4'
  nuxt@>=4.4.6 <4.6.4: '>=4.6.4'
  nuxt@>=4.6.0 <4.6.4: '>=4.6.4'
  serialize-javascript@<7.1.3: '>=7.1.3'
  undici@>=4.0.0 <6.29.1: '>=6.29.1'
  undici@>=4.2.1 <6.29.1: '>=6.29.1'
  undici@>=5.15.0 <6.29.1: '>=6.29.1'
  undici@>=6.23.0 <6.29.1: '>=6.29.1'
  undici@>=6.5.0 <6.29.1: '>=6.29.1'
  vue-i18n@>=11.1.10 <11.4.14: '>=11.4.14'
  vue-i18n@>=9.0.0-beta.5 <11.4.14: '>=11.4.14'

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  '@node-rs/bcrypt': true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@vite-pwa/assets-generator@1.0.4 || 2.0.0'
  - http-cache-semantics@4.3.0
